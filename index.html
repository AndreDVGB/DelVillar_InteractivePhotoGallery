<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="addTabIndex()">

    <div class="container">

        <h1>Interactive Photo Gallery</h1>

        <div id="image">
            Hover over an image below to display here.
        </div>

        <div class="gallery">

            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                alt="Beautiful mountain landscape"
                onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()"
            >

            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
                alt="Beautiful tropical beach"
                onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()"
            >

            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                alt="Green forest filled with trees"
                onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()"
            >

            <img
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                alt="Snow-covered mountain peaks"
                onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()"
            >

            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600"
                alt="Mountain lake surrounded by nature"
                onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()"
            >

            <img
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
                alt="Scenic valley with mountains"
                onmouseover="upDate(this)"
                onmouseleave="undo()"
                onfocus="upDate(this)"
                onblur="undo()"
            >

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
